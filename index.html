<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Sashira Iqlima Prasetyo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d8e7ff);
            background-size: 200% 200%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: backgroundGerak 8s ease infinite;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;

            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            animation: masuk 0.8s ease;
        }

        /* FOTO */

        .foto {
            width: 190px;
            height: 190px;
            object-fit: cover;

            border-radius: 50%;

            border: 6px solid white;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.2);

            animation: fotoMasuk 1s ease;
        }

        h1 {
            color: #d94f83;
            margin-bottom: 10px;

            animation: judulMasuk 1s ease;
        }

        .welcome {
            font-size: 18px;
            color: #555;
            line-height: 1.6;

            animation: munculPelan 1.2s ease;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: 0.3s;

            animation: tombolMasuk 0.7s ease backwards;
        }

        .menu button:nth-child(1) {
            animation-delay: 0.3s;
        }

        .menu button:nth-child(2) {
            animation-delay: 0.5s;
        }

        .menu button:nth-child(3) {
            animation-delay: 0.7s;
        }

        button:hover {
            transform: scale(1.05) translateY(-3px);
            opacity: 0.9;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        /* WARNA TOMBOL */

        .youtube {
            background-color: #ff0000;
        }

        .instagram {
            background: linear-gradient(
                45deg,
                #feda75,
                #d62976,
                #4f5bd5
            );
        }

        .biodata {
            background-color: #7b61ff;
        }

        /* KOTAK BIODATA */

        #biodataBox {
            display: none;

            margin-top: 25px;
            padding: 20px;

            background-color: #f8f1ff;
            border-radius: 15px;

            text-align: left;

            animation: biodataMasuk 0.5s ease;
        }

        #biodataBox h2 {
            color: #7b61ff;
            text-align: center;
        }

        #biodataBox p {
            font-size: 16px;
            line-height: 1.6;
        }

        .back {
            background-color: #777;
            margin-top: 10px;
            width: 100%;
        }

        /* =========================
           ANIMASI
           ========================= */

        @keyframes masuk {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fotoMasuk {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes judulMasuk {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes munculPelan {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes tombolMasuk {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes biodataMasuk {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes backgroundGerak {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- FOTO PROFIL -->

        <img
            src="foto.jpg"
            alt="Foto Sashira"
            class="foto"
        >

        <!-- JUDUL -->

        <h1>🌸 HALLOO! 🌸</h1>

        <p class="welcome">
            Selamat datang di website biodata
            <br>

            <b>Sashira Iqlima Prasetyo</b> 💗
        </p>

        <p>
            Silakan pilih menu di bawah ini 👇
        </p>

        <!-- MENU -->

        <div class="menu">

            <button
                class="youtube"
                onclick="bukaYoutube()"
            >
                ▶️ YouTube Favorit
            </button>

            <button
                class="instagram"
                onclick="bukaInstagram()"
            >
                📸 Instagram Saya
            </button>

            <button
                class="biodata"
                onclick="tampilkanBiodata()"
            >
                👤 Biodata Singkat Saya
            </button>

        </div>

        <!-- BIODATA -->

        <div id="biodataBox">

            <h2>👤 Biodata Sashira</h2>

            <p>
                <b>Nama Lengkap:</b><br>
                Sashira Iqlima Prasetyo
            </p>

            <p>
                <b>Nama Panggilan:</b><br>
                Ira / Shira
            </p>

            <p>
                <b>Umur:</b><br>
                16 tahun
            </p>

            <p>
                Halo! Nama saya Sashira Iqlima Prasetyo.
                Kalian bisa memanggil saya Ira atau Shira. 💗
            </p>

            <button
                class="back"
                onclick="tutupBiodata()"
            >
                🔙 Kembali
            </button>

        </div>

    </div>


    <script>

        // Membuka YouTube

        function bukaYoutube() {

            window.open(
                "https://youtube.com/@windahbasudara?si=EqZhEavwojRj-bev",
                "_blank"
            );

        }


        // Membuka Instagram

        function bukaInstagram() {

            window.open(
                "https://www.instagram.com/supersa.sashira?igsi=MXFsMms5YzluNzl0bg==",
                "_blank"
            );

        }


        // Menampilkan biodata

        function tampilkanBiodata() {

            document.getElementById("biodataBox").style.display = "block";

        }


        // Menutup biodata

        function tutupBiodata() {

            document.getElementById("biodataBox").style.display = "none";

        }

    </script>

</body>

</html>
